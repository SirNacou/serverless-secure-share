name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: arduino/setup-task@v2
        with:
          version: 3.x

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.9.0'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Build Lambda functions
        run: task build-lambda

      - name: Deploy infrastructure
        working-directory: infra
        run: |
          tofu init -input=false
          tofu apply -auto-approve -input=false
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Build frontend
        working-directory: src/frontend/frontend
        run: |
          npm install
          echo "VITE_API_ENDPOINT=$(cd ../../../infra && tofu output -raw api_endpoint)" > .env
          echo "VITE_COGNITO_DOMAIN=$(cd ../../../infra && tofu output -raw cognito_domain)" >> .env
          echo "VITE_COGNITO_USER_POOL_ID=$(cd ../../../infra && tofu output -raw cognito_pool_id)" >> .env
          echo "VITE_COGNITO_CLIENT_ID=$(cd ../../../infra && tofu output -raw cognito_client_id)" >> .env
          npm run build

      - name: Deploy frontend to S3
        run: |
          BUCKET=$(cd infra && tofu output -raw frontend_bucket_name 2>/dev/null || echo "")
          DIST_ID=$(cd infra && tofu output -raw frontend_distribution_id)
          aws s3 sync src/frontend/frontend/dist/ s3://$BUCKET/ --delete
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths /*
