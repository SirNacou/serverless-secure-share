name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Install dependencies
        run: bun install

      - name: Get API endpoint
        id: api-endpoint
        run: |
          ENDPOINT=$(bunx pulumi stack output publicApiEndpoint --stack dev 2>/dev/null || echo "")
          if [ -z "$ENDPOINT" ]; then
            echo "value=${{ secrets.API_ENDPOINT }}" >> $GITHUB_OUTPUT
          else
            echo "value=$ENDPOINT" >> $GITHUB_OUTPUT
          fi

      - name: Build frontend
        working-directory: src/frontend
        run: |
          bun install
          VITE_API_ENDPOINT=${{ steps.api-endpoint.outputs.value }} bun run build

      - name: Deploy with Pulumi
        run: bunx pulumi up --stack dev --yes
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
