name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Install dependencies
        run: bun install

      - name: Deploy infrastructure
        run: bunx pulumi up --stack dev --yes
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Build frontend
        working-directory: src/frontend
        run: |
          bun install
          echo "VITE_API_ENDPOINT=$(bunx pulumi --cwd ../.. stack output publicApiEndpoint --stack dev)" > .env
          echo "VITE_COGNITO_DOMAIN=$(bunx pulumi --cwd ../.. stack output cognitoDomain --stack dev)" >> .env
          echo "VITE_COGNITO_USER_POOL_ID=$(bunx pulumi --cwd ../.. stack output cognitoPoolId --stack dev)" >> .env
          echo "VITE_COGNITO_CLIENT_ID=$(bunx pulumi --cwd ../.. stack output cognitoClientId --stack dev)" >> .env
          bun run build
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Deploy frontend to S3
        run: |
          BUCKET=$(bunx pulumi stack output frontendBucketName --stack dev)
          DIST_ID=$(bunx pulumi stack output frontendDistributionId --stack dev)
          aws s3 sync src/frontend/dist/ s3://$BUCKET/ --delete
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths /*
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
