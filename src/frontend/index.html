<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Share Ingress</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md bg-slate-800 rounded-xl p-8 shadow-2xl border border-slate-700">
        <h2 class="text-2xl font-bold mb-6 text-center text-indigo-400">Secure Share Channel</h2>
        
        <div id="statusMessage" class="hidden mb-4 p-3 rounded text-sm text-center font-medium"></div>

        <div id="authSection" class="space-y-4">
            <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Identity Provider Portal</h3>
            <div>
                <label class="block text-xs mb-1 text-slate-400">Username / Email</label>
                <input type="email" id="email" value="developer@secureshare.local" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs mb-1 text-slate-400">Password</label>
                <input type="password" id="password" value="SecurePassword123!" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <button id="btnLogin" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 px-4 rounded text-sm transition">Authenticate session</button>
        </div>

        <div id="uploadSection" class="hidden space-y-4">
            <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Secure Upload Gate</h3>
            <div class="border-2 border-dashed border-slate-600 rounded-lg p-6 text-center hover:border-indigo-500 transition cursor-pointer relative">
                <input type="file" id="fileInput" class="absolute inset-0 opacity-0 cursor-pointer">
                <p id="fileLabel" class="text-sm text-slate-300">Click or drag file here to stage</p>
            </div>
            
            <div id="progressContainer" class="hidden space-y-1">
                <div class="flex justify-between text-xs text-slate-400">
                    <span>Streaming binary...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="w-full bg-slate-900 rounded-full h-2 overflow-hidden">
                    <div id="progressBar" class="bg-emerald-500 h-full w-0 transition-all duration-100"></div>
                </div>
            </div>

            <button id="btnUpload" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-4 rounded text-sm transition">Execute Secure Upload</button>
        </div>
    </div>

    <script>
        // Copy configurations directly from your Pulumi Outputs
        const CONFIG = {
            clientId: "609767nccd4a58ukf3h3rdah7j",
            apiEndpoint: "https://g79hs8yb1i.execute-api.ap-southeast-1.amazonaws.com"
        };

        let sessionAccessToken = "";

        // UI Selectors
        const authSection = document.getElementById('authSection');
        const uploadSection = document.getElementById('uploadSection');
        const statusMessage = document.getElementById('statusMessage');
        const fileInput = document.getElementById('fileInput');
        const fileLabel = document.getElementById('fileLabel');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');

        function showMessage(text, isError = false) {
            statusMessage.textContent = text;
            statusMessage.className = `mb-4 p-3 rounded text-sm text-center font-medium ${isError ? 'bg-rose-900/50 text-rose-300 border border-rose-800' : 'bg-emerald-900/50 text-emerald-300 border border-emerald-800'}`;
        }

        // Handle Staged File Label Updates
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                fileLabel.textContent = fileInput.files[0].name;
            }
        });

        // Step 1: Cognito Authentication Request
        document.getElementById('btnLogin').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`https://cognito-idp.ap-southeast-1.amazonaws.com/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-amz-json-1.1',
                        'X-Amz-Target': 'AWSCognitoIdentityProviderService.InitiateAuth'
                    },
                    body: JSON.stringify({
                        ClientId: CONFIG.clientId,
                        AuthFlow: 'USER_PASSWORD_AUTH',
                        AuthParameters: { USERNAME: email, PASSWORD: password }
                    })
                });

                const data = await response.json();
                
                if (!response.ok) throw new Error(data.message || 'Authentication rejected.');

                sessionAccessToken = data.AuthenticationResult.AccessToken;
                authSection.classList.add('hidden');
                uploadSection.classList.remove('hidden');
                showMessage('Identity context loaded. Session unlocked.');
            } catch (err) {
                showMessage(err.message, true);
            }
        });

        // Steps 2 & 3: Request Upload coordinates and execute streaming PUT
        document.getElementById('btnUpload').addEventListener('click', async () => {
            if (fileInput.files.length === 0) return showMessage('Please select a file first.', true);
            
            const file = fileInput.files[0];
            progressContainer.classList.remove('hidden');

            try {
                // 1. Fetch pre-signed URL coordinates from API
                const apiResponse = await fetch(`${CONFIG.apiEndpoint}/api/upload`, {
                    method: 'POST',
                    headers: {
                        'Authorization': sessionAccessToken,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ filename: file.name, contentType: file.type || 'application/octet-stream' })
                });

                const apiData = await apiResponse.json();
                if (!apiResponse.ok) throw new Error(apiData.message || 'API rejected metadata registration.');

                // 2. Stream Binary direct-to-S3 via XMLHttpRequest to track execution progress values
                const xhr = new XMLHttpRequest();
                xhr.open('PUT', apiData.uploadUrl, true);
                xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        progressBar.style.width = `${percent}%`;
                        progressPercent.textContent = `${percent}%`;
                    }
                };

                xhr.onload = () => {
                    if (xhr.status === 200) {
                        showMessage('File verification finalized. Storage channel updated.');
                        progressContainer.classList.add('hidden');
                    } else {
                        showMessage(`S3 Storage rejected payload. Status: ${xhr.status}`, true);
                    }
                };

                xhr.onerror = () => showMessage('Network handshake failed during storage stream.', true);
                xhr.send(file);

            } catch (err) {
                showMessage(err.message, true);
            }
        });
    </script>
</body>
</html>
